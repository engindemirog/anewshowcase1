# scripts/check.conf — the steps behind the single verification contract (./scripts/check).
# Generated by bootstrap (2026-10-26). Stack: Python 3.12 · uv · ruff · mypy · import-linter ·
# pytest · Playwright for Python · pip-audit (docs/conventions.md, ADR-0001).
# One step per line:  <name>: <command>   — runs in order, fails fast. [fast] = inner-loop profile.
#
# GREENFIELD: every step below is commented out because pyproject.toml / uv.lock / app/ / tests/ do
# not exist yet — check is a no-op until then. The first feature (walking skeleton) creates them and
# uncomments the steps in the SAME change; then rerun ./scripts/residue and ./scripts/residue --fast.
#
# Resource hygiene inventory (docs/testing.md, Resource hygiene):
# - uv: no daemon. `--frozen` → the run never rewrites uv.lock (rule 5: nothing leaks to the next run).
# - ruff, lint-imports, pip-audit: single process, exit. Caches (.ruff_cache) are speed, not state.
# - mypy: plain `mypy` (never `dmypy`) — resource hygiene: no type-check daemon.
# - pytest: no pytest-xdist → no parallel workers; `-p no:cacheprovider` → no last-failed state
#   carried into the next run (rule 5). Unit/API tests use in-memory or tmp_path SQLite (rule 5).
# - e2e: the app under test (uvicorn) is started and stopped by ONE session fixture, in `finally`,
#   incl. failure/timeout (rule 4); pytest-playwright closes Chromium at session end; headless by
#   default, single worker. Temp SQLite file deleted by the same fixture (rule 5).
# - audit: needs the network — full only.
# Test-count check at activation: `pytest -m "not e2e"` + `pytest -m e2e` must collect the same
# number of tests as plain `pytest` (selector split, docs/testing.md Two speeds rule 4).
#
# lint [fast]: uv run --frozen ruff check .
# format [fast]: uv run --frozen ruff format --check .
# resource hygiene: no type-check daemon (plain mypy, not dmypy)
# types [fast]: uv run --frozen mypy app
# architecture [fast]: uv run --frozen lint-imports
# resource hygiene: no xdist workers, no cache state between runs
# test [fast]: uv run --frozen pytest -q -p no:cacheprovider -m "not e2e"
# resource hygiene: app lifecycle owned by the e2e session fixture; headless Chromium, one worker
# e2e: uv run --frozen pytest -q -p no:cacheprovider -m e2e --browser chromium
# audit: uv run --frozen pip-audit --strict
